name: Registry health
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy production registry]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  issues: write
concurrency:
  group: registry-health
  cancel-in-progress: false
jobs:
  health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production-store-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node src/health-ci.js
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_ROOT_CUSTODY_SHA256: ${{ vars.PRODUCTION_ROOT_CUSTODY_SHA256 }}
          DEPLOYMENT_FAILED: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
