name: Prepare signed publication
# This creates a reviewed publication artifact, NOT a live deployment.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Increasing TUF metadata version
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: plugin-publication
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      previous_run_id: ${{ steps.history.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Locate latest successful publication (not an operator-selected old run)
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous_run=$(gh api "repos/$GH_REPO/actions/workflows/prepare-publication.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          echo "run_id=$previous_run" >> "$GITHUB_OUTPUT"
      - name: Restore authoritative approved bytes and signed history
        if: steps.history.outputs.run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-plugin-publication
          path: previous
          run-id: ${{ steps.history.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Reuse frozen artifacts, fetch only new release hashes
        env:
          PREVIOUS_RUN_ID: ${{ steps.history.outputs.run_id }}
        run: |
          if [ -n "$PREVIOUS_RUN_ID" ]; then
            node src/cli.js fetch registry.json sources public previous root.json
          else
            node src/cli.js fetch registry.json sources public
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-packages
          path: |
            public/quarantine/*.mmxp
            public/publication-input.json
          if-no-files-found: error
  publication:
    if: github.ref == 'refs/heads/main'
    needs: import
    environment: plugin-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-packages
          path: public
      - name: Restore immutable prior publication artifact
        if: needs.import.outputs.previous_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-plugin-publication
          path: previous
          run-id: ${{ needs.import.outputs.previous_run_id }}
          github-token: ${{ github.token }}
      - name: Sign with protected online roles only
        env:
          METADATA_VERSION: ${{ inputs.version }}
          PREVIOUS_RUN_ID: ${{ needs.import.outputs.previous_run_id }}
          TARGETS_PRIVATE_KEY: ${{ secrets.TARGETS_PRIVATE_KEY }}
          SNAPSHOT_PRIVATE_KEY: ${{ secrets.SNAPSHOT_PRIVATE_KEY }}
          TIMESTAMP_PRIVATE_KEY: ${{ secrets.TIMESTAMP_PRIVATE_KEY }}
        run: node src/ci-publish.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-plugin-publication
          path: |
            public/metadata
            public/targets
            public/registry-state.json
          if-no-files-found: error
