name: Deploy signed Pages test store
on:
  push:
    branches: [main]
    paths: ['test-store/**', 'src/**', '.github/workflows/pages-test-store.yml', 'package*.json']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Allow FIRST publication only when no gh-pages history exists
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-test-store
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: test-store-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Sign separate test channel, authenticating durable history
        run: mkdir pages-bundle && node src/pages-ci.js prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
          TEST_TARGETS_KEY: ${{ secrets.TEST_TARGETS_KEY }}
          TEST_SNAPSHOT_KEY: ${{ secrets.TEST_SNAPSHOT_KEY }}
          TEST_TIMESTAMP_KEY: ${{ secrets.TEST_TIMESTAMP_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-pages-test-bundle
          path: pages-bundle/
          include-hidden-files: true
          retention-days: 7
  publish:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-pages-test-bundle
          path: pages-bundle/
      - name: Retain history with a normal, race-checked gh-pages push
        run: node src/pages-ci.js publish
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pages-bundle/site
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public static test store
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
